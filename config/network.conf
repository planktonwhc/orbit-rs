# Orbit appliance network config.
# Applied by `orbit-net` via NetworkManager (nmcli) on Raspberry Pi OS Trixie.
# On the appliance this lives at: /data/orbit/config/network.conf
#
# Shell syntax: KEY=value, one per line, '#' comments. Quote values that
# contain spaces:  AP_SSID="My Orbit AP"

# ap     = be a Wi-Fi hotspot (DEFAULT). Connect a phone/laptop to it to reach
#          the appliance: set the stream/renderer config, view status.
# client = join an existing Wi-Fi as a station -- for firmware-update checks
#          and anything else that needs the internet.
MODE=ap

WIFI_IFACE=wlan0
COUNTRY=ID                        # regulatory domain; needed for many channels/5GHz

# --- AP mode ---------------------------------------------------------------
AP_SSID=OrbitFPV
AP_PASSWORD=orbitfpv123           # >= 8 chars for WPA2; leave empty for an OPEN network
AP_BAND=bg                        # bg = 2.4 GHz, a = 5 GHz
AP_CHANNEL=6
AP_HIDDEN=0
AP_IP=192.168.50.1/24            # the Pi's address on the AP; NetworkManager runs DHCP for clients
                                 # (clients also get internet here if the Pi has it via eth0)

# --- client mode --------------------------------------------------------------
CLIENT_SSID=
CLIENT_PASSWORD=                  # empty = open upstream network
# If the join fails (out of range / wrong key), orbit-net falls back to AP mode
# so the appliance is never left unreachable.
